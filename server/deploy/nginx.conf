server {
    listen 80;
    server_name wavcloud.duckdns.org;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wavcloud.duckdns.org;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/wavcloud.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wavcloud.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Multipart requests may contain more than one 500 MB file.
    client_max_body_size 1G;

    # PWA static files (Vite build output)
    root /opt/cloudmusic/client/dist;
    index index.html;

    # API & Streaming → proxy to Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important for streaming - disable buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout for long streaming connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # X-Accel-Redirect: Nginx serves audio files directly from disk (kernel sendfile)
    # Node.js only authenticates and returns X-Accel-Redirect header → Nginx handles the rest
    location /internal-media/ {
        internal;
        alias /mnt/music/;

        # Kernel-level zero-copy file transfer with Linux RAM Page Cache enabled
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 512k;

        # Cache open file descriptors to eliminate stat() filesystem overhead
        open_file_cache max=2000 inactive=30m;
        open_file_cache_valid 20m;
        open_file_cache_min_uses 1;
        open_file_cache_errors off;

        # Range request support (instant seeking)
        add_header Accept-Ranges bytes always;

        # CORS headers for cross-origin audio loading
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Headers Range always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

        # Disable proxy-level caching
        add_header Cache-Control "no-cache" always;
    }

    # PWA Service Worker - must not be cached
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Static assets - long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Digital Asset Links for Android TWA (removes browser URL bar)
    location /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # SPA fallback - all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
