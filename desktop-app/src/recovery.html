<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>WavCloud</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, 'Malgun Gothic', sans-serif; background: #090c12; color: #f2f4fa; }
    body { min-height: 100vh; box-sizing: border-box; margin: 0; display: grid; place-items: center; padding: 32px; }
    main { max-width: 480px; } img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 28px; margin: 24px 0 14px; } p { color: #a9b2c5; line-height: 1.8; }
    a { display: inline-block; color: #fff; background: #627eff; border-radius: 12px; padding: 13px 22px; text-decoration: none; margin-top: 18px; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; } small { display: block; margin-top: 28px; color: #7e8aa3; }
  </style>
</head>
<body><main>
  <img src="assets/icon.png" alt="WavCloud">
  <h1>음악 화면을 열지 못했어요.</h1>
  <p>인터넷 연결과 서버 상태를 확인한 뒤 다시 열어주세요.<br>로그인 정보와 저장한 음악은 그대로 보관됩니다.</p>
  <a href="https://wavcloud.duckdns.org/">다시 열기</a>
  <small>WavCloud · wavcloud.duckdns.org</small>
</main></body>
</html>
